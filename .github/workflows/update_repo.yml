name: Update IPAOMTK Repo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Scraper
        run: |
          python extractor.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f apps.json ]; then
            git add apps.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update apps.json" && git push)
          else
            echo "apps.json بوونی نییە!"
            exit 1
          fi
